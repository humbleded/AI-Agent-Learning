name: Workbench CI and CD

on:
  pull_request:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the checked images to production (main only)
        type: boolean
        default: false
      scope:
        description: Select changed services automatically or rebuild a specific service
        type: choice
        options: [auto, web, api, both]
        default: auto

permissions:
  contents: read

# Serialize production runs from baseline inspection through verification.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.deploy) || (github.event_name == 'push' && vars.WORKBENCH_AUTO_DEPLOY == 'true')) && 'workbench-production' || format('workbench-ci-{0}', github.run_id) }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: code/agent_workbench
    shell: bash

jobs:
  live:
    name: Read the deployed version of each service
    if: github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.deploy && inputs.scope == 'auto') || (github.event_name == 'push' && vars.WORKBENCH_AUTO_DEPLOY == 'true'))
    environment:
      name: production
      deployment: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      web_base: ${{ steps.versions.outputs.web_base }}
      api_base: ${{ steps.versions.outputs.api_base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read image tags from running containers
        id: versions
        env:
          DEPLOY_HOST: ${{ vars.WORKBENCH_HOST }}
          DEPLOY_USER: ${{ vars.WORKBENCH_USER }}
          RELEASE_DIRNAME: ${{ vars.WORKBENCH_RELEASE_DIR }}
          DEPLOY_KEY: ${{ secrets.WORKBENCH_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.WORKBENCH_KNOWN_HOSTS }}
        run: bash deploy/live-bases.sh

  ci:
    name: Build and test the workbench
    needs: live
    if: ${{ !cancelled() && (needs.live.result == 'success' || needs.live.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: workbench-ci
      SHIP: ${{ github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.deploy) || (github.event_name == 'push' && vars.WORKBENCH_AUTO_DEPLOY == 'true')) }}
    outputs:
      scope: ${{ steps.plan.outputs.scope }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the deployment scripts and change detection
        run: |
          for script in deploy/*.sh; do bash -n "$script"; done
          python3 -m unittest discover -s deploy -p 'test_*.py' -v
      - name: Select services
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          REQUESTED_SCOPE: ${{ inputs.scope || 'auto' }}
          LIVE_WEB_BASE: ${{ needs.live.outputs.web_base }}
          LIVE_API_BASE: ${{ needs.live.outputs.api_base }}
        run: bash deploy/select-scope.sh
      - name: Record the selected scope
        env:
          SCOPE: ${{ steps.plan.outputs.scope }}
        run: |
          echo "Selected services: $SCOPE"
          printf 'Selected services: **%s**\n' "$SCOPE" >> "$GITHUB_STEP_SUMMARY"
      - name: Build and start only the selected services
        if: steps.plan.outputs.scope != 'none'
        env:
          SCOPE: ${{ steps.plan.outputs.scope }}
        run: |
          services=("$SCOPE")
          if [[ $SCOPE == both ]]; then services=(web api); fi
          docker compose up --build --detach --no-deps "${services[@]}"
      - name: Run the API and incident tests in the built API image
        if: steps.plan.outputs.scope == 'api' || steps.plan.outputs.scope == 'both'
        run: |
          docker compose run --rm --no-deps -T \
            -v "$PWD/api/tests:/app/code/agent_workbench/api/tests:ro" \
            -v "$PWD/../stage8/incident_change_review_agent/test_incident_graph.py:/app/code/stage8/incident_change_review_agent/test_incident_graph.py:ro" \
            api python -m pytest -q -p no:cacheprovider \
            agent_workbench/api/tests stage8/incident_change_review_agent/test_incident_graph.py
      - name: Verify the selected services
        if: steps.plan.outputs.scope != 'none'
        env:
          SCOPE: ${{ steps.plan.outputs.scope }}
        run: |
          if [[ $SCOPE == api ]]; then
            docker compose exec -T api python - http://127.0.0.1:8765 --only api < deploy/check-workbench.py
          else
            python3 deploy/check-workbench.py http://127.0.0.1:8081 --only "$SCOPE"
          fi
      - name: Package the checked images
        if: env.SHIP == 'true' && steps.plan.outputs.scope != 'none'
        env:
          SCOPE: ${{ steps.plan.outputs.scope }}
        run: |
          services=("$SCOPE")
          if [[ $SCOPE == both ]]; then services=(web api); fi
          tags=()
          for service in "${services[@]}"; do
            tag="ai-workbench-$service:git-$GITHUB_SHA"
            image=$(docker inspect --format '{{.Image}}' "$(docker compose ps -q "$service")")
            docker image tag "$image" "$tag"
            tags+=("$tag")
          done
          mkdir -p "$RUNNER_TEMP/release"
          cd "$RUNNER_TEMP/release"
          docker image save "${tags[@]}" | gzip -1 > images.tar.gz
          sha256sum images.tar.gz > SHA256SUMS
      - name: Upload the selected images
        id: upload
        if: env.SHIP == 'true' && steps.plan.outputs.scope != 'none'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workbench-${{ github.run_id }}-${{ steps.plan.outputs.scope }}
          path: ${{ runner.temp }}/release/
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
          overwrite: true
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 60
      - name: Stop CI containers
        if: always() && steps.plan.outputs.scope != '' && steps.plan.outputs.scope != 'none'
        run: docker compose down

  deploy:
    name: Deploy the checked release to Tencent Cloud
    needs: ci
    if: ${{ !cancelled() && needs.ci.result == 'success' && github.ref == 'refs/heads/main' && needs.ci.outputs.artifact_id != '' }}
    environment: production
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download, verify and switch the selected services
        env:
          DEPLOY_HOST: ${{ vars.WORKBENCH_HOST }}
          DEPLOY_USER: ${{ vars.WORKBENCH_USER }}
          RELEASE_DIRNAME: ${{ vars.WORKBENCH_RELEASE_DIR }}
          DEPLOY_KEY: ${{ secrets.WORKBENCH_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.WORKBENCH_KNOWN_HOSTS }}
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.ci.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.ci.outputs.artifact_digest }}
          RELEASE_SCOPE: ${{ needs.ci.outputs.scope }}
        run: bash deploy/deliver-release.sh
